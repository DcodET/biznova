# ==============================================================================
# BIZNOVA Platform - Enterprise Security Configuration for Nginx
# ==============================================================================

# 1. Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 2. Block Hidden Files (.env, .git, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# 3. Block Direct Access to wp-config.php and Readme
location ~* /(wp-config\.php|readme\.html|license\.txt) {
    deny all;
}

# 4. Block XML-RPC
location = /xmlrpc.php {
    deny all;
    access_log off;
    log_not_found off;
}

# 5. Prevent Execution of PHP Scripts in Uploads Directory
location ~* ^/wp-content/uploads/.*\.php$ {
    deny all;
}

# 6. Block User Enumeration Probes
if ($query_string ~* "author=[0-9]+") {
    return 301 /;
}
